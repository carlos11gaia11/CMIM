name: Publicar CMIM no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serializa publicacoes para evitar o erro de deploy simultaneo no Pages.
concurrency:
  group: cmim-pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Testar draft
        run: npm test

      - name: Verificar sintaxe dos scripts da agenda e torneios
        run: |
          node --check public/agenda.js
          node --check public/campeonatos.js
          node --check public/cmim-competitive-details.js
          node --check public/cmim-creators.js
          node --check public/cmim-auth.js

      - name: Compilar CMIM
        run: npm run build
        env:
          BASE_PATH: /CMIM/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Aguardar o pacote de publicação
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          for attempt in {1..15}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == env.ARTIFACT_NAME and .expired == false)] | length' || echo 0)
            if [ "$count" = "1" ]; then sleep 15; exit 0; fi
            sleep 3
          done
          echo 'O pacote de publicação não ficou disponível na API do GitHub.' >&2
          exit 1

      - name: Publicar site
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Aguardar nova tentativa
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Repetir publicação se necessário
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
